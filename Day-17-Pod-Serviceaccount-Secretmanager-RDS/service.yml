apiVersion: v1
kind: Service
metadata:
  name: flask-backend-svc
  namespace: default          # <-- must match deployment.yaml's namespace
  labels:
    app: flask-backend
spec:
  # ClusterIP is fine if you're fronting this with an Ingress / ALB.
  # Switch to LoadBalancer to provision an AWS NLB/ELB directly, or
  # NodePort if you're routing through something else.
  type: ClusterIP
  selector:
    app: flask-backend        # matches deployment.yaml -> spec.template.metadata.labels.app
  ports:
    - name: http
      port: 80                # port other services/ingress use to reach this Service
      targetPort: 5000         # matches containerPort in deployment.yaml
      protocol: TCP

---
